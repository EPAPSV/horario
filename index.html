/* "Escala" (título principal: Raleway Black) */
#escala{position:absolute;left:78px;top:410px;font-weight:900;font-size:112px;letter-spacing:-2px;line-height:1}

/* Tabela ao centro, com moldura fina */
#moldura{position:absolute;left:513px;top:35px;width:894px;padding:7px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tabela{display:flex;flex-direction:column;gap:2px;max-height:790px;background:#e3f5dc;color:#0e3a14}
.l{display:grid;grid-template-columns:150px 1fr 1fr;gap:2px;flex:0 1 34px;min-height:0}
.l>div{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;white-space:nowrap}
.l.cab>div{background:#82e48d;font-family:'Barlow','Raleway',sans-serif;font-size:28px}
.l.cab>div:first-child{justify-content:flex-start;padding-left:10px}
.l.dado>div:first-child{background:#166a22;color:#fff;font-family:'Barlow','Raleway',sans-serif;font-size:28px;justify-content:flex-start;padding-left:10px}
.l.dado:nth-child(even)>div:not(:first-child){background:#c2efc6}
.l.dado:nth-child(odd)>div:not(:first-child){background:#85e291}
.vazio{background:#e3f5dc;color:#166a22;font-weight:800;font-size:38px;text-align:center;line-height:1.35;padding:90px 20px}

/* Hora, data e tempo */
#w{position:absolute;left:1477px;top:204px;width:400px;text-align:center;text-shadow:0 3px 10px rgba(0,0,0,.25)}
#hora{font-weight:900;font-size:98px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#diasemana{font-weight:600;font-size:37px;margin-top:14px}
#data{font-weight:400;font-size:29px;opacity:.92;margin-top:4px}
.sep{width:70%;height:3px;background:rgba(255,255,255,.45);border-radius:10px;margin:22px auto}
.local{font-size:25px;opacity:.85;margin-bottom:10px}
.agora{display:flex;align-items:center;justify-content:center;gap:16px}
.agora svg{width:88px;height:88px;flex:none}
.temp{font-weight:900;font-size:78px;line-height:1}
.desc{font-size:29px;margin-top:8px;font-weight:600}
.minmax{font-size:27px;margin-top:6px;opacity:.95}
.prox{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.dia{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.16);border-radius:13px;padding:8px 18px;font-size:26px;font-weight:600}
.dia svg{width:46px;height:46px}.dia .nome{width:38%;text-align:left}.dia .mm{width:40%;text-align:right}

#estado{position:absolute;right:20px;bottom:10px;font-size:14px;color:rgba(255,255,255,.7);text-align:right}
#estado.aviso{color:#fff;background:#b3261e;padding:4px 10px;border-radius:4px;font-weight:600}
</style>
</head>
<body>
<div id="palco">
  <div id="escala">Escala</div>
  <div id="moldura"><div id="tabela"></div></div>
  <div id="w">
    <div id="hora">--:--</div><div id="diasemana"></div><div id="data"></div>
    <div class="sep"></div><div id="tempo"></div>
  </div>
  <div id="estado"></div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
var URL_DADOS     = "horarios.json";   // ficheiro gerado pelo Power Automate
var REFRESCAR_MIN = 1;                 // de quantos em quantos minutos volta a ler os horários
var AVISO_APOS_MIN = 15;               // sem dados novos há mais tempo → aviso "sem ligação"
var TZ = "Europe/Lisbon";
var LAT = 40.7333, LON = -8.3667;      // Sever do Vouga
var LOCAL = "Sever do Vouga";
/* ========================= */

var DIAS  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
var CURTO = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function $(id){ return document.getElementById(id); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---- Ajuste ao ecrã ---- */
function ajustar(){ var s=Math.min(innerWidth/1920,innerHeight/1080); $("palco").style.transform="translate(-50%,-50%) scale("+s+")"; }
addEventListener("resize",ajustar); ajustar();

/* ---- Relógio: hora de Lisboa, corrigida pela hora do servidor ---- */
var offset = 0;   // diferença (ms) entre a hora real e o relógio da TV
function agora(){ return new Date(Date.now()+offset); }
function partes(d){
  try{
    var f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"});
    var o={}; f.formatToParts(d).forEach(function(p){ o[p.type]=p.value; });
    return {y:+o.year,m:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute};
  }catch(e){ return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),h:d.getHours(),mi:d.getMinutes()}; }
}
function diaSemana(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function relogio(){
  var p=partes(agora());
  $("hora").textContent = pad(p.h)+":"+pad(p.mi);
  $("diasemana").textContent = DIAS[diaSemana(p.y,p.m,p.d)];
  $("data").textContent = p.d+" de "+MESES[p.m-1]+" de "+p.y;
}

/* ---- Horários ---- */
var dados=null, ultimoOk=null;
try{ var c=localStorage.getItem("escala_dados"); if(c) dados=JSON.parse(c); }catch(e){}

function chaveHoje(){
  var m=/[?&]data=(\d{4}-\d{2}-\d{2})/.exec(location.search);   // ?data=AAAA-MM-DD só para testes
  if(m) return m[1];
  var p=partes(agora()); return p.y+"-"+pad(p.m)+"-"+pad(p.d);
}
function desenhar(){
  var t=$("tabela"), linhas=dados&&dados.dias&&dados.dias[chaveHoje()];
  if(!linhas||!linhas.length){
    t.innerHTML='<div class="vazio">'+(dados?"Hoje não há<br>escala de entrada":"A aguardar dados…")+'</div>';
    return;
  }
  var h='<div class="l cab"><div>Equipa</div><div>Horário de entrada</div><div>Espaço de Trabalho</div></div>';
  for(var i=0;i<linhas.length;i++){
    h+='<div class="l dado"><div>'+esc(linhas[i].equipa)+'</div><div>'+esc(linhas[i].entrada)+'</div><div>'+esc(linhas[i].espaco)+'</div></div>';
  }
  t.innerHTML=h;
}
function estado(){
  var e=$("estado"), velho=!ultimoOk || (Date.now()-ultimoOk)/60000>AVISO_APOS_MIN;
  if(velho){ e.className="aviso"; e.textContent="Sem ligação — a mostrar a última versão"; }
  else{ var p=partes(new Date(ultimoOk+offset)); e.className=""; e.textContent="atualizado "+pad(p.h)+":"+pad(p.mi); }
}
function carregar(){
  fetch(URL_DADOS+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    var dh=r.headers.get("Date"), age=parseInt(r.headers.get("Age")||"0",10)||0;
    if(dh){ var srv=new Date(dh).getTime()+age*1000; if(!isNaN(srv)) offset=srv-Date.now(); }   // acerta o relógio pela hora do servidor
    return r.json();
  }).then(function(j){
    if(!j||typeof j.dias!=="object") throw new Error("formato");
    dados=j; ultimoOk=Date.now();
    try{ localStorage.setItem("escala_dados",JSON.stringify(j)); }catch(e){}
    relogio(); desenhar(); estado();
  }).catch(function(e){ console.warn("Horários indisponíveis",e); desenhar(); estado(); });
}

/* ---- Tempo (Open-Meteo) ---- */
var W="#fff";
function sol(){ return '<circle cx="32" cy="32" r="11" fill="#ffd93b"/><g stroke="#ffd93b" stroke-width="4" stroke-linecap="round"><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M49 15l-5 5M20 44l-5 5"/></g>'; }
function nuvem(c,dx,dy){ c=c||W; dx=dx||0; dy=dy||0; return '<path transform="translate('+dx+' '+dy+')" d="M18 46a10 10 0 0 1-1-19.9A13 13 0 0 1 42 22a11 11 0 0 1 4 24z" fill="'+c+'"/>'; }
function gotas(){ return '<g stroke="#bfe3ff" stroke-width="4" stroke-linecap="round"><path d="M22 52l-3 7M33 52l-3 7M44 52l-3 7"/></g>'; }
function icone(code,noite){
  var g;
  if(code===0) g = noite ? '<path d="M40 12a20 20 0 1 0 12 30A17 17 0 0 1 40 12z" fill="#ffe99a"/>' : sol();
  else if(code<=2) g = (noite?'':'<g transform="translate(-6 -8) scale(.75)">'+sol()+'</g>')+nuvem(W,2,0);
  else if(code===3) g = nuvem('#e6eef0',0,0);
  else if(code===45||code===48) g = nuvem('#dfe9eb',0,-4)+'<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M14 52h36M20 59h28"/></g>';
  else if((code>=51&&code<=67)||(code>=80&&code<=82)) g = nuvem('#dfe9eb',0,-6)+gotas();
  else if((code>=71&&code<=77)||code===85||code===86) g = nuvem('#e6eef0',0,-6)+'<g fill="#fff"><circle cx="22" cy="55" r="3"/><circle cx="33" cy="58" r="3"/><circle cx="44" cy="55" r="3"/></g>';
  else if(code>=95) g = nuvem('#c9d3d6',0,-6)+'<path d="M35 44l-8 12h7l-3 8 11-14h-7z" fill="#ffd93b"/>';
  else g = nuvem();
  return '<svg viewBox="0 0 64 64" aria-hidden="true">'+g+'</svg>';
}
var DESC={0:"Céu limpo",1:"Pouco nublado",2:"Parcialmente nublado",3:"Nublado",45:"Nevoeiro",48:"Nevoeiro",51:"Chuvisco",53:"Chuvisco",55:"Chuvisco",56:"Chuvisco gelado",57:"Chuvisco gelado",61:"Chuva fraca",63:"Chuva",65:"Chuva forte",66:"Chuva gelada",67:"Chuva gelada",71:"Neve fraca",73:"Neve",75:"Neve forte",77:"Neve granulada",80:"Aguaceiros",81:"Aguaceiros",82:"Aguaceiros fortes",85:"Aguaceiros de neve",86:"Aguaceiros de neve",95:"Trovoada",96:"Trovoada com granizo",99:"Trovoada com granizo"};
function carregarTempo(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FLisbon&forecast_days=6";
  fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
    var c=j.current, d=j.daily;
    var h='<div class="local">'+esc(LOCAL)+'</div>'+
      '<div class="agora">'+icone(c.weather_code,c.is_day===0)+'<div class="temp">'+Math.round(c.temperature_2m)+'°</div></div>'+
      '<div class="desc">'+esc(DESC[c.weather_code]||"")+'</div>'+
      '<div class="minmax">Mín '+Math.round(d.temperature_2m_min[0])+'° · Máx '+Math.round(d.temperature_2m_max[0])+'°</div><div class="prox">';
    for(var i=1;i<d.time.length&&i<=5;i++){
      var q=d.time[i].split("-"), nome=i===1?"Amanhã":CURTO[diaSemana(+q[0],+q[1],+q[2])];
      h+='<div class="dia"><span class="nome">'+esc(nome)+'</span>'+icone(d.weather_code[i])+'<span class="mm">'+Math.round(d.temperature_2m_min[i])+'° / '+Math.round(d.temperature_2m_max[i])+'°</span></div>';
    }
    $("tempo").innerHTML=h+"</div>";
  }).catch(function(e){ console.warn("Tempo indisponível",e); /* mantém o último valor */ });
}

/* ---- Arranque ---- */
relogio(); desenhar(); estado();
carregar(); carregarTempo();
setInterval(relogio,1000);
setInterval(carregar,REFRESCAR_MIN*60000);
setInterval(function(){ desenhar(); estado(); },60000);   // muda de dia à hora certa, mesmo sem novos dados
setInterval(carregarTempo,30*60000);
setTimeout(function(){ location.reload(); },6*3600*1000);   // recarrega a página de 6 em 6 horas
</script>
