<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Escala de Entrada</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --fundo:#2a2b2f; --verde1:#229c69; --verde2:#55aa06;
    --data:#196b23; --cab:#82e48d; --equipa:#166a22;
    --linhaA:#c2efc6; --linhaB:#85e291;
    --alterado:#ffd54a; --desmarcado:#e9e9e9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  body{font-family:"Montserrat","Segoe UI","Helvetica Neue",Arial,sans-serif}

  /* Palco fixo 1920x1080, ajustado ao tamanho do ecrã */
  #palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;overflow:hidden;
    background:linear-gradient(90deg,var(--verde1) 30%,var(--verde2) 100%)}
  #escuro{position:absolute;inset:0;background:var(--fundo);
    clip-path:polygon(0 0,693px 0,1073px 1080px,0 1080px)}

  #logo{position:absolute;left:56px;top:58px;width:235px}
  #rodape{position:absolute;left:56px;top:905px;width:945px}

  #lema{position:absolute;left:695px;top:42px;font-weight:700;font-size:112px;line-height:.78;
    letter-spacing:-3px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.85);
    pointer-events:none;white-space:nowrap}
  #lema span{display:block}
  #lema span:nth-child(1){font-size:112px}
  #lema span:nth-child(2){font-size:86px;margin-left:70px;margin-top:6px}
  #lema span:nth-child(3){font-size:68px;margin-top:4px}
  #site{position:absolute;right:56px;top:70px;text-align:right;color:#fff}
  #site small{display:block;font-size:30px;font-weight:700;letter-spacing:.3px}
  #site b{display:block;font-size:82px;font-weight:400;line-height:1;margin-top:2px}

  #titulo{position:absolute;left:80px;top:425px;color:#fff;font-weight:900;font-size:76px;letter-spacing:-1px;white-space:nowrap}

  /* Tabela */
  #tabela{position:absolute;left:1045px;top:205px;width:828px;height:805px;
    display:flex;flex-direction:column;gap:2px;color:#0e3a14}
  .l{display:grid;grid-template-columns:119px 1fr 1fr;gap:2px;flex:1 1 0;min-height:0;max-height:46px}
  .l>div{display:flex;align-items:center;justify-content:center;font-size:23px;white-space:nowrap}
  .l.data{flex:0 0 33px}
  .l.data>div{background:var(--data);color:#fff;font-weight:700;font-size:21px}
  .l.data>div:first-child{background:var(--data)}
  .l.data>div:last-child{grid-column:span 2}
  .l.cab>div{background:var(--cab);font-weight:700;font-size:23px}
  .l.cab>div:first-child{justify-content:flex-start;padding-left:6px;background:var(--cab)}
  .l.dado>div:first-child{background:var(--equipa);color:#fff;font-weight:700;justify-content:flex-start;padding-left:6px}
  .l.dado:nth-child(odd)>div:not(:first-child){background:var(--linhaA)}
  .l.dado:nth-child(even)>div:not(:first-child){background:var(--linhaB)}
  .l.alterado>div:not(:first-child){background:var(--alterado)!important;font-weight:800;color:#5a1a00}
  .l.alterado>div:first-child{background:#b3261e!important}
  .l.desmarcado>div:not(:first-child){background:var(--desmarcado)!important;color:#777;text-decoration:line-through}

  #vazio{position:absolute;left:1045px;top:205px;width:828px;height:805px;display:none;
    align-items:center;justify-content:center;text-align:center;color:#fff;font-size:44px;font-weight:700}

  #estado{position:absolute;right:20px;bottom:10px;font-size:14px;color:rgba(255,255,255,.65);text-align:right}
  #estado.aviso{color:#fff;background:#b3261e;padding:4px 10px;border-radius:4px}
</style>
</head>

<script>
/* ===== CONFIGURAÇÃO ===== */
const URL_DADOS   = "horarios.json";  // endereço do ficheiro gerado pelo Power Automate
const REFRESCAR_MIN = 2;              // de quantos em quantos minutos volta a ler os dados
const HORA_AMANHA   = "18:30";        // depois desta hora mostra o dia seguinte (se já existir escala)
const AVISO_APOS_MIN = 15;            // sem dados novos há mais tempo que isto → aviso "sem ligação"
/* ========================= */

const DADOS_EXEMPLO = {"atualizado": "exemplo", "dias": {"2026-10-26": [{"equipa": "4EB", "entrada": "10:30", "espaco": "Qualidade 1", "estado": "normal"}, {"equipa": "4EC", "entrada": "10:30", "espaco": "Eletrónica", "estado": "normal"}, {"equipa": "4ED", "entrada": "09:30", "espaco": "Otimização 1", "estado": "normal"}, {"equipa": "4EE", "entrada": "10:30", "espaco": "Telecomunicações", "estado": "normal"}, {"equipa": "4EF", "entrada": "09:30", "espaco": "Ginásio", "estado": "normal"}, {"equipa": "4EG", "entrada": "10:30", "espaco": "Otimização 2", "estado": "normal"}, {"equipa": "4EM", "entrada": "09:30", "espaco": "Instrumentação", "estado": "normal"}, {"equipa": "4EN", "entrada": "10:30", "espaco": "Análise", "estado": "normal"}, {"equipa": "4EO", "entrada": "09:30", "espaco": "Qualidade 2", "estado": "normal"}, {"equipa": "4EP", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "4EQ", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "4ER", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "4EX", "entrada": "09:30", "espaco": "Analise", "estado": "normal"}, {"equipa": "4EZ", "entrada": "10:30", "espaco": "Autonomia 2", "estado": "normal"}, {"equipa": "4EY", "entrada": "10:30", "espaco": "Iniciativa", "estado": "normal"}, {"equipa": "4FA", "entrada": "09:30", "espaco": "Resultados 2", "estado": "normal"}, {"equipa": "4FB", "entrada": "10:30", "espaco": "Energias", "estado": "normal"}, {"equipa": "4FC", "entrada": "09:30", "espaco": "Automação", "estado": "normal"}, {"equipa": "T2BN", "entrada": "09:30", "espaco": "TA 1", "estado": "normal"}, {"equipa": "T2BQ", "entrada": "09:30", "espaco": "Resultado 1", "estado": "normal"}, {"equipa": "T3AU", "entrada": "09:30", "espaco": "TA 1", "estado": "normal"}], "2026-10-08": [{"equipa": "4EB", "entrada": "09:30", "espaco": "Qualidade 2", "estado": "normal"}, {"equipa": "4EC", "entrada": "09:30", "espaco": "Energias", "estado": "normal"}, {"equipa": "4ED", "entrada": "09:30", "espaco": "Eletrónica", "estado": "normal"}, {"equipa": "4EE", "entrada": "10:30", "espaco": "Resultados 1", "estado": "normal"}, {"equipa": "4EF", "entrada": "09:30", "espaco": "Qualidade 1", "estado": "normal"}, {"equipa": "4EG", "entrada": "09:30", "espaco": "Automação", "estado": "normal"}, {"equipa": "4EM", "entrada": "09:30", "espaco": "Melhoria", "estado": "normal"}, {"equipa": "4EN", "entrada": "10:30", "espaco": "Iniciativa", "estado": "normal"}, {"equipa": "4EO", "entrada": "09:30", "espaco": "Otimização 2", "estado": "normal"}, {"equipa": "4EP", "entrada": "09:30", "espaco": "Instrumentação", "estado": "normal"}, {"equipa": "4EQ", "entrada": "09:30", "espaco": "Analise", "estado": "normal"}, {"equipa": "4ER", "entrada": "09:30", "espaco": "Iniciativa", "estado": "normal"}, {"equipa": "4EX", "entrada": "09:30", "espaco": "Ginásio", "estado": "normal"}, {"equipa": "4EZ", "entrada": "09:30", "espaco": "Telecomunicações", "estado": "normal"}, {"equipa": "4EY", "entrada": "09:30", "espaco": "Autonomia 1", "estado": "normal"}, {"equipa": "4FA", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "4FB", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "4FC", "entrada": "09:30", "espaco": "Creative Studio", "estado": "normal"}, {"equipa": "T2BN", "entrada": "09:30", "espaco": "TA", "estado": "normal"}, {"equipa": "T2BQ", "entrada": "09:30", "espaco": "TA", "estado": "normal"}, {"equipa": "T3AU", "entrada": "09:30", "espaco": "TA", "estado": "normal"}]}};

const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $=id=>document.getElementById(id);
let dados=null, origem="exemplo", ultimoOk=null;

function ajustar(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  $("palco").style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize",ajustar); ajustar();

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function escolherDia(dias){
  const p=new URLSearchParams(location.search).get("data");
  if(p && dias[p]) return p;
  const agora=new Date(), chaves=Object.keys(dias).sort();
  let alvo=new Date(agora);
  const [hh,mm]=HORA_AMANHA.split(":").map(Number);
  if(agora.getHours()*60+agora.getMinutes()>=hh*60+mm){
    const am=new Date(agora); am.setDate(am.getDate()+1);
    if(dias[iso(am)]) alvo=am;
  }
  const k=iso(alvo);
  if(dias[k]) return k;
  const futuro=chaves.find(c=>c>k); if(futuro) return futuro;   // ex.: fim de semana → próxima segunda
  const passado=chaves.filter(c=>c<k).pop(); return passado||null;
}

function desenhar(){
  const t=$("tabela"), dias=(dados&&dados.dias)||{};
  const dia=escolherDia(dias);
  if(!dia){t.style.display="none";$("vazio").style.display="flex";return;}
  $("vazio").style.display="none"; t.style.display="flex";
  const [y,m,d]=dia.split("-").map(Number);
  let h=`<div class="l data"><div></div><div>${pad(d)}/${MESES[m-1]}</div></div>
         <div class="l cab"><div>Equipa</div><div>Horário de entrada</div><div>Espaço de Trabalho</div></div>`;
  for(const r of dias[dia]){
    const est=(r.estado||"normal").toLowerCase();
    h+=`<div class="l dado ${est==="normal"?"":est}"><div>${esc(r.equipa)}</div><div>${esc(r.entrada)}</div><div>${esc(r.espaco)}</div></div>`;
  }
  t.innerHTML=h;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function estado(){
  const e=$("estado"), hora=`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const velho=!ultimoOk || (Date.now()-ultimoOk)/60000>AVISO_APOS_MIN;
  if(origem==="exemplo"){e.className="";e.textContent="dados de exemplo · "+hora;}
  else if(velho){e.className="aviso";e.textContent="Sem ligação — a mostrar última versão";}
  else {e.className="";e.textContent="atualizado "+hora;}
}

async function carregar(){
  try{
    const r=await fetch(URL_DADOS+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    if(!j||!j.dias) throw new Error("formato");
    dados=j; origem="ligado"; ultimoOk=Date.now();
  }catch(e){
    if(!dados){dados=DADOS_EXEMPLO; origem="exemplo";}
  }
  desenhar(); estado();
}

carregar();
setInterval(carregar,REFRESCAR_MIN*60000);
setInterval(()=>{desenhar();estado();},60000);   // muda de dia à hora certa, mesmo sem novos dados
setTimeout(()=>location.reload(),6*3600*1000);   // recarrega a página de 6 em 6 horas
</script>
